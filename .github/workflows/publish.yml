# Publishes this n8n community node package to npm on every version tag push.
#
# Starting May 1 2026, n8n requires all community nodes to be published via
# GitHub Actions with npm provenance statements. This workflow satisfies that
# requirement. Provenance lets anyone cryptographically verify that a package
# was built by this exact workflow, from this exact repository and commit.
#
# ─── PREREQUISITES ─────────────────────────────────────────────────────────────
#
# @n8n/node-cli ≥ 0.23.0 is required. Earlier versions do not support the
# provenance flag passed by `npm run release` in CI, and the publish step will
# fail. Check the version installed in this project with:
#
#   npm list @n8n/node-cli
#
# To upgrade, add @n8n/node-cli@latest as a dev dependency using your package manager.
#
# ─── ONE-TIME SETUP ────────────────────────────────────────────────────────────
#
# Option A — OIDC Trusted Publishing (recommended, no long-lived secrets):
#   1. Log in to npmjs.com and open your package's settings.
#   2. Under "Publish access" → "Trusted Publishers", click "Add a publisher".
#   3. Select GitHub Actions and fill in:
#        Repository owner: <your-github-username-or-org>
#        Repository name:  <your-repo-name>
#        Workflow name:    publish.yml
#        Environment:      (leave blank unless you use GitHub Environments)
#   4. Leave the NPM_TOKEN secret unset in this repository. GitHub's OIDC
#      token is used instead — no secret ever touches your repo settings.
#
# Option B — npm Automation Token (fallback):
#   1. On npmjs.com: Access Tokens → Generate New Token → Granular Access Token.
#      Scope it to this package with "Read and write" publish permission.
#   2. In GitHub: Settings → Secrets and variables → Actions → New secret.
#      Name it NPM_TOKEN and paste the token value.
#
# Both options work with --provenance. Provenance is signed by GitHub's OIDC
# infrastructure regardless of how npm authentication is handled.
#
# ─── RELEASE PROCESS ───────────────────────────────────────────────────────────
#
# ONE WAY TO RELEASE, no manual steps:
#
#   1. bump "version" in package.json  (in your PR)
#   2. add a CHANGELOG.md entry
#   3. merge
#
# The push to main runs this workflow, which publishes if that version is not on
# npm yet. No tag to push, no local command to run.
#
# Forgetting the bump is harmless — the guard sees the version already on npm
# and skips, so merging an ordinary PR never republishes.
#
# There is deliberately NO tag trigger, NO manual dispatch, and `npm run
# release` refuses to run outside CI (scripts/ci-only.mjs). Every one of those
# would be a SECOND way to release, and two paths is how a version gets skipped
# or double-published. Run locally, `n8n-node release` bumps the version itself
# and publishes without the provenance attestation n8n Cloud requires — quietly
# wrong in two ways at once, which is why it is closed rather than documented.
#
# If a run fails, re-run it from the Actions tab. The guard makes that safe.

name: Publish

on:
  # The ONLY way this package publishes. A version bump lands on main and the
  # guard below decides whether there is anything to do, so this is safe to run
  # on every merge.
  #
  # There is deliberately no tag trigger and no manual dispatch. Both would be a
  # second way to release, and two release paths is how a version gets skipped
  # or published twice. If a run fails, re-run it from the Actions tab — the
  # guard makes that idempotent.
  push:
    branches:
      - main

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest

    permissions:
      # Required to mint an OIDC token for npm provenance attestation.
      id-token: write
      # Scoped down from the default (write) for least-privilege publishing.
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'npm'

      - name: Install dependencies
        run: 'npm ci'

      # Is the version in package.json already on npm? This is what makes it
      # safe to run on every push to main. npm is the source of truth here, not
      # git tags — a tag can be missing, mistyped, or created for a version that
      # never published, whereas "is this version on the registry" is the exact
      # question we care about and cannot be wrong about.
      #
      # `npm view <pkg>@<version> version` exits non-zero when the version does
      # not exist, which is the signal to publish.
      - name: Decide whether there is anything to publish
        id: check
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          echo "Package: ${NAME}@${VERSION}"
          if npm view "${NAME}@${VERSION}" version > /dev/null 2>&1; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "⏭️  ${NAME}@${VERSION} is already on npm — nothing to do."
            echo "    (This is the normal outcome for a PR that did not bump the version.)"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "✅ ${NAME}@${VERSION} is not on npm yet — publishing."
          fi

      - name: Release
        if: steps.check.outputs.publish == 'true'
        # Publishes to npm with a provenance attestation (requires id-token: write above).
        # Lint and build run automatically as part of the release process.
        #
        # Option A (OIDC): leave NPM_TOKEN unset — the token step is skipped and
        #   npm uses the OIDC exchange instead.
        # Option B (token): set NPM_TOKEN in repo secrets — it is written to
        #   .npmrc here before publishing.
        run: |
          [ -n "$NPM_TOKEN" ] && npm config set //registry.npmjs.org/:_authToken "$NPM_TOKEN"
          npm run release
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
